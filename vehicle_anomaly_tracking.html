<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>车辆异常追踪管控 - 运营管理平台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; font-size: 13px; }
  .layout { display: flex; min-height: 100vh; }

  /* ===== 侧边栏 ===== */
  .sidebar { width: 220px; background: #232732; color: #fff; padding: 16px 0; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; overflow-y: auto; }
  .logo { padding: 0 20px 16px; font-size: 15px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 8px; }
  .logo-icon { width: 28px; height: 28px; background: #3c7eff; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .nav-group { padding: 12px 0; }
  .nav-title { padding: 8px 20px; color: rgba(255,255,255,0.3); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .nav-item { padding: 10px 20px 10px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin: 2px 8px; border-radius: 4px; transition: all 0.2s; color: rgba(255,255,255,0.65); font-size: 13px; }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .nav-item.active { background: #3c7eff; color: #fff; }
  .nav-badge { background: #e54d42; color: #fff; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; }

  .main { flex: 1; margin-left: 220px; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .header { height: 52px; background: #fff; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 0 #f0f0f0; }
  .breadcrumb { color: #999; font-size: 13px; }
  .breadcrumb span { color: #333; font-weight: 500; }
  .user-info { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 32px; height: 32px; border-radius: 4px; background: #3c7eff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; cursor: pointer; }

  .content { padding: 20px; flex: 1; overflow-y: auto; overflow-x: hidden; min-width: 0; }
  .page-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: #111; }

  /* ===== 统计卡片 ===== */
  .stat-cards { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: #fff; padding: 16px 16px 14px; border-radius: 6px; cursor: pointer; border: 1px solid #e8e8e8; transition: all 0.2s; }
  .stat-card:hover { border-color: #3c7eff; }
  .stat-card.active { border-color: #3c7eff; background: #f0f5ff; }
  .stat-label { color: #999; font-size: 11px; font-weight: 500; }
  .stat-value { font-size: 28px; font-weight: 700; margin-top: 6px; color: #1a1a1a; line-height: 1; }

  /* ===== 筛选栏 ===== */
  .filter-bar { background: #fff; padding: 14px 16px; border-radius: 8px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .filter-bar input, .filter-bar select { height: 30px; padding: 0 10px; border: 1px solid #e8e8e8; border-radius: 6px; font-size: 12px; transition: all 0.2s; background: #fafafa; }
  .filter-bar input:focus, .filter-bar select:focus { outline: none; border-color: #3c7eff; background: #fff; box-shadow: 0 0 0 2px rgba(60,126,255,0.1); }
  .filter-bar input { width: 200px; }

  /* ===== 按钮 ===== */
  .btn { height: 30px; padding: 0 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px; }
  .btn-primary { background: #3c7eff; color: #fff; }
  .btn-primary:hover { background: #5a93ff; }
  .btn-default { background: #fff; border: 1px solid #d9d9d9; color: #555; }
  .btn-default:hover { border-color: #3c7eff; color: #3c7eff; }
  .btn-danger { background: #e54d42; color: #fff; }
  .btn-danger:hover { background: #f06860; }
  .btn-success { background: #3c7eff; color: #fff; }
  .btn-success:hover { background: #5a93ff; }
  .btn-warning { background: #e54d42; color: #fff; }
  .btn-warning:hover { background: #f06860; }
  .btn-sm { height: 26px; padding: 0 10px; font-size: 11px; }
  .btn-text { background: transparent; border: none; color: #3c7eff; padding: 0 6px; height: auto; }
  .btn-text:hover { color: #5a93ff; }

  .list-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .list-toolbar-left { color: #999; font-size: 12px; }
  .list-toolbar-left strong { color: #333; }
  .view-btn { background: #fff; border: none; padding: 0 16px; height: 28px; font-size: 12px; color: #666; cursor: pointer; transition: all 0.2s; }
  .view-btn.active { background: #3c7eff; color: #fff; }

  /* ===== 表格 ===== */
  .table-wrap { background: #fff; border-radius: 8px; overflow-x: auto; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  table { width: max-content; min-width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #f5f5f5; font-size: 12px; white-space: nowrap; }
  th { background: #fafafa; font-weight: 600; color: #666; position: sticky; top: 0; z-index: 1; border-bottom: 2px solid #f0f0f0; }
  th.col-action { position: sticky; right: 0; z-index: 2; background: #fafafa; box-shadow: -2px 0 6px rgba(0,0,0,0.06); }
  td.col-action { position: sticky; right: 0; background: #fff; box-shadow: -2px 0 6px rgba(0,0,0,0.06); white-space: nowrap; }
  tbody tr { cursor: pointer; transition: background 0.15s; }
  tbody tr:hover { background: #f0f5ff; }
  tbody tr:hover td.col-action { background: #f0f5ff; }
  tbody tr.row-selected { background: #e6f0ff; }

  /* ===== Tag ===== */
  .tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; line-height: 18px; font-weight: 500; }
  .tag-self { background: #e6f0ff; color: #3c7eff; }
  .tag-lease { background: #fff7e6; color: #d48806; }
  .tag-pending { background: #fff7e6; color: #d48806; }
  .tag-approved { background: #f0f5ff; color: #3c7eff; }
  .tag-rejected { background: #fff1f0; color: #e54d42; }
  .tag-abnormal { background: #fff1f0; color: #e54d42; }
  .tag-wait-recover { background: #f0f5ff; color: #3c7eff; }
  .tag-recovered { background: #f6ffed; color: #52c41a; }
  .tag-closed { background: #fafafa; color: #999; }
  .tag-cancelled { background: #fafafa; color: #999; }
  .tag-vs-offline { background: #f5f5f5; color: #8c8c8c; }
  .tag-vs-normal { background: #f5f5f5; color: #333; }
  .tag-vs-pending { background: #f5f5f5; color: #bbb; }

  /* ===== 抽屉 ===== */
  .drawer-mask { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0); z-index: 99; transition: background 0.3s; }
  .drawer-mask.show { display: block; background: rgba(0,0,0,0.45); }
  .drawer { position: fixed; top: 0; right: -800px; width: 800px; height: 100%; background: #fff; z-index: 100; transition: right 0.35s cubic-bezier(0.23,1,0.32,1); overflow-y: auto; box-shadow: -4px 0 24px rgba(0,0,0,0.12); }  .drawer.show { right: 0; }
  .drawer-header { padding: 0 20px; height: 56px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; background: #fff; position: sticky; top: 0; z-index: 10; }
  .drawer-header-left { display: flex; align-items: center; gap: 10px; }
  .drawer-title { font-size: 15px; font-weight: 700; color: #111; }
  .close-btn { cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #999; transition: all 0.2s; background: transparent; }
  .close-btn:hover { background: #f5f5f5; color: #333; transform: rotate(90deg); }
  .drawer-body { padding: 20px; }

  /* ===== 详情卡片 ===== */
  .detail-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 16px 20px; margin-bottom: 12px; border: 1px solid #f0f0f0; }
  .section-title { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 6px; }
  .section-title .icon { color: #3c7eff; }
  .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 24px; margin-bottom: 4px; }
  .info-grid .span2 { grid-column: span 2; }
  .info-grid .span3 { grid-column: span 3; }
  .info-item { display: flex; font-size: 12px; line-height: 1.8; }
  .info-label { color: #aaa; min-width: 80px; flex-shrink: 0; }
  .info-value { color: #333; flex: 1; }

  /* ===== 车效影响高亮卡片 ===== */
  .impact-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .impact-item { background: #f7f9fc; border-radius: 8px; padding: 14px 16px; text-align: center; border: 1px solid #eef1f6; }
  .impact-label { font-size: 11px; color: #999; margin-bottom: 6px; }
  .impact-value { font-size: 16px; font-weight: 700; color: #333; }
  .impact-value.red { color: #e54d42; }
  .impact-value.orange { color: #d48806; }
  .impact-value.green { color: #52c41a; }
  .impact-value.blue { color: #3c7eff; }
  .impact-value.tag-recovered-text { color: #52c41a; }
  .impact-value.tag-unrecovered-text { color: #e54d42; }

  /* ===== 审批流程 ===== */
  .approval-flow { padding: 0; }
  .approval-node { display: flex; gap: 12px; padding: 10px 0; position: relative; }
  .approval-node:not(:last-child)::after { content: ''; position: absolute; left: 11px; top: 32px; bottom: -2px; width: 1px; background: #e8e8e8; }
  .approval-node.done:not(:last-child)::after { background: #b7eb8f; }
  .approval-node.rejected:not(:last-child)::after { background: #ffa39e; }
  .approval-node.cancelled::after { background: #e8e8e8 !important; }
  .node-icon { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; border: 2px solid #e8e8e8; color: #bbb; background: #fafafa; z-index: 1; }
  .node-icon.done { background: #f6ffed; border-color: #b7eb8f; color: #52c41a; }
  .node-icon.current { background: #f0f5ff; border-color: #3c7eff; color: #3c7eff; }
  .node-icon.rejected { background: #fff1f0; border-color: #ffa39e; color: #e54d42; }
  .node-icon.cancelled { background: #fafafa; border-color: #e8e8e8; color: #d9d9d9; }
  @keyframes nodePulse { 0%,100%{box-shadow:0 0 0 0 rgba(60,126,255,0.3)} 50%{box-shadow:0 0 0 6px rgba(60,126,255,0)} }
  .node-content { flex: 1; }
  .node-title { font-size: 13px; font-weight: 600; color: #333; }
  .node-title.cancelled { color: #999; text-decoration: line-through; }
  .node-info { font-size: 11px; color: #999; margin-top: 2px; }
  .node-info .name { color: #555; font-weight: 500; }
  .node-opinion { font-size: 11px; color: #666; background: #f7f8fa; padding: 6px 10px; border-radius: 4px; margin-top: 4px; border-left: 2px solid #d9d9d9; }
  .node-opinion.approved { border-left-color: #52c41a; }
  .node-opinion.rejected-op { border-left-color: #e54d42; }

  /* ===== 工单进度 ===== */
  .status-flow { display: flex; align-items: center; padding: 12px 0; margin-bottom: 4px; overflow-x: auto; }
  .status-step { display: flex; flex-direction: column; align-items: center; min-width: 90px; }
  .step-circle { width: 24px; height: 24px; border-radius: 50%; background: #f0f0f0; color: #bbb; display: flex; align-items: center; justify-content: center; font-size: 11px; border: 1px solid #e8e8e8; }
  .step-circle.done { background: #f6ffed; color: #52c41a; border-color: #b7eb8f; }
  .step-circle.current { background: #3c7eff; color: #fff; border-color: #3c7eff; }
  .step-label { font-size: 11px; margin-top: 4px; color: #999; }
  .step-label.current-label { color: #3c7eff; font-weight: 600; }
  .step-line { flex: 1; height: 1px; background: #e8e8e8; margin: 0 4px; min-width: 20px; }
  .step-line.done { background: #b7eb8f; }
  .timeline { padding: 0; margin-top: 8px; }
  .timeline-item { display: flex; gap: 10px; padding: 6px 0; font-size: 12px; align-items: flex-start; border-bottom: 1px dashed #f0f0f0; }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-dot { width: 7px; height: 7px; border-radius: 50%; background: #d9d9d9; flex-shrink: 0; margin-top: 5px; }
  .timeline-dot.done { background: #52c41a; }
  .timeline-dot.current { background: #3c7eff; box-shadow: 0 0 0 3px rgba(60,126,255,0.15); }
  .timeline-text { color: #555; }

  /* ===== 弹窗 ===== */
  .modal-mask { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0); z-index: 200; align-items: center; justify-content: center; transition: background 0.25s; }
  .modal-mask.show { display: flex; background: rgba(0,0,0,0.5); }
  .modal { background: #fff; width: 520px; border-radius: 10px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); transform: scale(0.92) translateY(20px); opacity: 0; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s; }
  .modal-mask.show .modal { transform: scale(1) translateY(0); opacity: 1; }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid #f5f5f5; display: flex; justify-content: space-between; align-items: center; }
  .modal-header strong { font-size: 15px; color: #111; }
  .modal-body { padding: 20px; }
  .modal-footer { padding: 12px 20px; border-top: 1px solid #f5f5f5; display: flex; gap: 8px; justify-content: flex-end; background: #fafafa; border-radius: 0 0 10px 10px; }

  .form-item { margin-bottom: 14px; }
  .form-label { display: block; margin-bottom: 6px; font-size: 12px; color: #555; font-weight: 500; }
  .form-label.required:before { content: '*'; color: #ff4d4f; margin-right: 4px; }
  .form-control { width: 100%; height: 32px; padding: 0 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 13px; transition: all 0.2s; }
  .form-control:focus { outline: none; border-color: #3c7eff; box-shadow: 0 0 0 2px rgba(60,126,255,0.1); }
  textarea.form-control { height: auto; padding: 8px 10px; resize: vertical; }

  .upload-box { width: 100%; height: 80px; border: 1.5px dashed #d9d9d9; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; transition: border-color 0.2s; color: #999; font-size: 12px; background: #fafafa; }
  .upload-box:hover { border-color: #3c7eff; color: #3c7eff; background: #f0f5ff; }


  .alert-tip { background: #fffbe6; border: 1px solid #ffe58f; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #ad6800; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }

  /* ===== Toast ===== */
  #toastContainer { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .toast { background: rgba(30,30,30,0.88); backdrop-filter: blur(8px); color: #fff; padding: 10px 20px; border-radius: 24px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); transform: translateY(-20px); opacity: 0; transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1); pointer-events: none; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: rgba(60,126,255,0.9); }
  .toast.error { background: rgba(229,77,66,0.9); }
  .toast.warning { background: rgba(60,126,255,0.9); }

  .hidden { display: none !important; }
  .photo-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .photo-thumb { width: 60px; height: 60px; border-radius: 3px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 1px solid #e8e8e8; overflow: hidden; cursor: pointer; flex-direction: column; color: #bbb; }
  .photo-thumb:hover { border-color: #3c7eff; }

  /* 响应式微调 */
  @media (max-width: 1400px) { .stat-cards { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 1200px) { .impact-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="layout">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="logo"><div class="logo-icon">YM</div> 运营管理平台</div>
    <div class="nav-group">
      <div class="nav-title">车辆管控</div>
      <div class="nav-item active"><span>车辆异常追踪</span><span class="nav-badge" id="navBadge">4</span></div>
    </div>
  </div>

  <!-- 主体 -->
  <div class="main">
    <div class="header">
      <div class="breadcrumb">车辆管控 / <span>车辆异常追踪</span></div>
      <div class="user-info"><span style="font-size:12px;color:#666">管理员</span><div class="avatar">管</div></div>
    </div>
    <div class="content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="page-title">车辆异常追踪管控</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-default" onclick="exportCSV()">导出列表</button>
          <button class="btn btn-primary" onclick="openAddModal()">+ 新增异常提报</button>
        </div>
      </div>

      <!-- 统计卡片 -->
      <div class="stat-cards">
        <div class="stat-card" data-filter="vehicleStatus" data-value="已下线" onclick="statCardFilter(this)">
          <div class="stat-label">已下线</div><div class="stat-value" id="statOffline">0</div>
        </div>
        <div class="stat-card" data-filter="approvalStatus" data-value="待审批" onclick="statCardFilter(this)">
          <div class="stat-label">待审批</div><div class="stat-value" id="statPending">4</div>
        </div>
        <div class="stat-card" data-filter="operStatus" data-value="车辆异常" onclick="statCardFilter(this)">
          <div class="stat-label">车辆异常</div><div class="stat-value" id="statAbnormal">5</div>
        </div>
        <div class="stat-card" data-filter="operStatus" data-value="待确认恢复" onclick="statCardFilter(this)">
          <div class="stat-label">待确认恢复</div><div class="stat-value" id="statWaitRecover">2</div>
        </div>
        <div class="stat-card" data-filter="operStatus" data-value="已恢复运营" onclick="statCardFilter(this)">
          <div class="stat-label">已恢复运营</div><div class="stat-value" id="statRecovered">3</div>
        </div>
        <div class="stat-card" data-filter="operStatus" data-value="已关闭" onclick="statCardFilter(this)">
          <div class="stat-label">已关闭</div><div class="stat-value" id="statClosed">1</div>
        </div>
        <div class="stat-card" data-filter="" data-value="" onclick="statCardFilter(this)">
          <div class="stat-label">总影响天数</div><div class="stat-value" id="statTotalDays">0</div>
        </div>
      </div>

      <!-- 筛选栏 -->
      <div class="filter-bar">
        <input type="text" id="filterSearch" placeholder="搜索车号" oninput="applyFilters()">
        <select id="filterBrand" onchange="applyFilters()"><option value="">品牌</option><option value="新石器">新石器</option><option value="京东">京东</option></select>
        <select id="filterAnomalyType" onchange="applyFilters()"><option value="">异常类型</option><option value="交通事故">交通事故</option><option value="硬件问题">硬件问题</option><option value="软件问题">软件问题</option><option value="路权问题">路权问题</option><option value="运营问题">运营问题</option></select>
        <select id="filterVehicleStatus" onchange="applyFilters()"><option value="">车辆状态</option><option value="正常运营">正常运营</option><option value="已下线">已下线</option><option value="待上线">待上线</option></select>
        <select id="filterApproval" onchange="applyFilters()"><option value="">审批状态</option><option value="待审批">待审批</option><option value="已通过">已通过</option><option value="已驳回">已驳回</option></select>

        <select id="filterDateDim" onchange="updateDateDimOptions()" style="width:80px;">
          <option value="">维度</option><option value="week">周</option><option value="month">月</option><option value="year">年</option>
        </select>
        <select id="filterDateDimVal" onchange="applyDateDimFilter()" style="width:100px;">
          <option value="">请先选择维度</option>
        </select>
        <button class="btn btn-primary" onclick="applyFilters()">筛选</button>
        <button class="btn btn-default" onclick="resetFilters()">重置</button>
        <input type="hidden" id="filterDateStart">
        <input type="hidden" id="filterDateEnd">
      </div>

      <!-- 列表工具栏 -->
      <div class="list-toolbar">
        <div class="list-toolbar-left">共 <strong id="totalCount">0</strong> 条记录</div>

// ===== 工具函数 =====
function toast(msg, type) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function(){ t.classList.add('show'); }, 30);
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); }, 300); }, 2500);
}

// ===== 统计 =====
function updateStats() {
  var pending=0, abnormal=0, waitRecover=0, recovered=0, closed=0, offline=0, totalDays=0;
  mockData.forEach(function(d){
    if(d.approvalStatus==='待审批') pending++;
    if(d.operStatus==='车辆异常') abnormal++;
    if(d.operStatus==='待确认恢复') waitRecover++;
    if(d.operStatus==='已恢复运营') recovered++;

    if(d.operStatus==='已关闭') closed++;
    if(d.vehicleStatus==='已下线') offline++;
    totalDays += d.impactDays;
  });
  document.getElementById('statOffline').textContent = offline;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statAbnormal').textContent = abnormal;
  document.getElementById('statWaitRecover').textContent = waitRecover;
  document.getElementById('statRecovered').textContent = recovered;
  document.getElementById('statClosed').textContent = closed;
  document.getElementById('statTotalDays').textContent = totalDays;
  var badge = document.getElementById('navBadge');
  if(badge) badge.textContent = pending;
}

// ===== 筛选 =====
var activeStatFilter = null;
function statCardFilter(el) {
  var filterKey = el.getAttribute('data-filter');
  var filterVal = el.getAttribute('data-value');
  document.querySelectorAll('.stat-card').forEach(function(c){ c.classList.remove('active'); });
  if(activeStatFilter && activeStatFilter.key === filterKey && activeStatFilter.val === filterVal) {
    activeStatFilter = null;
  } else {
    el.classList.add('active');
    activeStatFilter = { key: filterKey, val: filterVal };
  }
  applyFilters();
}

function applyFilters() {
  var search = document.getElementById('filterSearch').value.trim().toLowerCase();
  var brand = document.getElementById('filterBrand').value;
  var anomalyType = document.getElementById('filterAnomalyType').value;
  var vehicleStatus = document.getElementById('filterVehicleStatus').value;
  var approval = document.getElementById('filterApproval').value;

  var dateStart = document.getElementById('filterDateStart').value;
  var dateEnd = document.getElementById('filterDateEnd').value;

  var filtered = mockData.filter(function(d) {
    if(search && d.vehicleNo.toLowerCase().indexOf(search)===-1) return false;
    if(brand && d.brand !== brand) return false;
    if(anomalyType && d.anomalyType !== anomalyType) return false;
    if(vehicleStatus && d.vehicleStatus !== vehicleStatus) return false;
    if(approval && d.approvalStatus !== approval) return false;

    if(dateStart && d.startTime < dateStart) return false;
    if(dateEnd && d.startTime > dateEnd + ' 23:59') return false;
    if(activeStatFilter && activeStatFilter.key) {
      if(activeStatFilter.key === 'approvalStatus' && d.approvalStatus !== activeStatFilter.val) return false;
      if(activeStatFilter.key === 'operStatus' && d.operStatus !== activeStatFilter.val) return false;
      if(activeStatFilter.key === 'vehicleStatus' && d.vehicleStatus !== activeStatFilter.val) return false;
    }
    return true;
  });
  renderTable(filtered);
}

function updateDateDimOptions() {
  var dim = document.getElementById('filterDateDim').value;
  var sel = document.getElementById('filterDateDimVal');
  sel.innerHTML = '';
  if(!dim) { sel.innerHTML = '<option value="">请先选择维度</option>'; applyFilters(); return; }
  var now = new Date();
  var year = now.getFullYear();
  if(dim === 'week') {
    // 计算当前是第几周，生成周选项
    var currentWeek = getWeekNumber(now);
    for(var w = currentWeek; w >= 1; w--) {
      var range = getWeekRange(year, w);
      sel.innerHTML += '<option value="'+w+'">第'+w+'周 ('+range.start.slice(5)+'~'+range.end.slice(5)+')</option>';
    }
  } else if(dim === 'month') {
    var currentMonth = now.getMonth() + 1;
    for(var m = currentMonth; m >= 1; m--) {
      sel.innerHTML += '<option value="'+m+'">'+m+'月</option>';
    }
  } else if(dim === 'year') {
    for(var y = year; y >= year - 2; y--) {
      sel.innerHTML += '<option value="'+y+'">'+y+'年</option>';
    }
  }
  applyFilters();
}

function getWeekNumber(d) {
  var oneJan = new Date(d.getFullYear(), 0, 1);
  var dayOfYear = Math.floor((d - oneJan) / 86400000) + 1;
  return Math.ceil(dayOfYear / 7);
}

function getWeekRange(year, week) {
  var oneJan = new Date(year, 0, 1);
  var start = new Date(oneJan.getTime() + (week - 1) * 7 * 86400000);
  var end = new Date(start.getTime() + 6 * 86400000);
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}

function applyDateDimFilter() {
  var dim = document.getElementById('filterDateDim').value;
  var val = document.getElementById('filterDateDimVal').value;
  if(!dim || !val) { applyFilters(); return; }
  var start, end;
  var year = new Date().getFullYear();
  if(dim === 'week') {
    var range = getWeekRange(year, parseInt(val));
    start = range.start; end = range.end;
  } else if(dim === 'month') {
    var m = parseInt(val);
    start = year + '-' + (m < 10 ? '0' + m : m) + '-01';
    var lastDay = new Date(year, m, 0).getDate();
    end = year + '-' + (m < 10 ? '0' + m : m) + '-' + lastDay;
  } else if(dim === 'year') {
    start = val + '-01-01'; end = val + '-12-31';
  }
  // 同步到隐藏的日期字段供applyFilters使用
  document.getElementById('filterDateStart').value = start;
  document.getElementById('filterDateEnd').value = end;
  applyFilters();
}

function resetFilters() {
  document.getElementById('filterSearch').value = '';
  document.getElementById('filterBrand').value = '';
  document.getElementById('filterAnomalyType').value = '';
  document.getElementById('filterVehicleStatus').value = '';
  document.getElementById('filterApproval').value = '';

  document.getElementById('filterDateDim').value = '';
  document.getElementById('filterDateDimVal').innerHTML = '<option value="">请先选择维度</option>';
  document.getElementById('filterDateStart').value = '';
  document.getElementById('filterDateEnd').value = '';
  activeStatFilter = null;
  document.querySelectorAll('.stat-card').forEach(function(c){ c.classList.remove('active'); });
  applyFilters();
}

// ===== 渲染表格 =====
function renderTable(data) {
  renderTableHead();
  var tbody = document.getElementById('tableBody');
  if(!data) data = mockData;

  if(currentView === 'order') {
    document.getElementById('totalCount').textContent = data.length;
    var html = '';
    data.forEach(function(d) {
      var actions = '';
      if(d.operStatus === '待确认恢复') {
        actions += '<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();confirmRecover(\''+d.id+'\')">确认恢复</button> ';
      }
      actions += '<button class="btn btn-text" onclick="event.stopPropagation();openDrawer(\''+d.id+'\')">详情</button>';
      html += '<tr data-id="'+d.id+'" onclick="openDrawer(\''+d.id+'\')">' +
        '<td>'+d.brand+'</td>' +
        '<td>'+d.station+'</td>' +
        '<td style="font-weight:600;">'+d.vehicleNo+'</td>' +
        '<td>'+d.anomalyType+(d.subType?'<br><span style="color:#999;font-size:10px;">'+d.subType+'</span>':'')+'</td>' +
        '<td>'+vehicleStatusTag(d.vehicleStatus)+'</td>' +
        '<td>'+approvalTag(d.approvalStatus)+'</td>' +
        '<td>'+d.startTime+'</td>' +
        '<td>'+recoverTag(d.recovered)+'</td>' +
        '<td>'+((d.recoverDate||'-'))+'</td>' +
        '<td style="'+impactDaysStyle(d.impactDays)+'">'+d.impactDays+'天</td>' +
        '<td>'+d.reporter+'</td>' +
        '<td>'+((d.workOrderId?'<a href="javascript:void(0)" onclick="event.stopPropagation();toast(\'工单详情：'+d.workOrderId+'\',\'warning\')" style="color:#3c7eff;">'+d.workOrderId+'</a>':'-'))+'</td>' +
        '<td class="col-action">'+actions+'</td>' +
        '</tr>';
    });
    tbody.innerHTML = html;
  } else {
    // 车辆维度：按vehicleNo聚合
    var vehicleMap = {};
    data.forEach(function(d) {
      if(!vehicleMap[d.vehicleNo]) {
        vehicleMap[d.vehicleNo] = { brand: d.brand, station: d.station, vehicleNo: d.vehicleNo, vehicleStatus: d.vehicleStatus||'正常运营', orders: [], totalDays: 0 };
      }
      vehicleMap[d.vehicleNo].orders.push(d);
      vehicleMap[d.vehicleNo].totalDays += d.impactDays;
    });
    var vehicles = Object.values(vehicleMap);
    document.getElementById('totalCount').textContent = vehicles.length;
    var html = '';
    vehicles.forEach(function(v) {
      var vs = v.orders.some(function(o) { return o.operStatus !== '已恢复运营' && o.operStatus !== '已关闭'; }) ? '已下线' : '正常运营';
      var orderOverview = v.orders.map(function(o) {
        var timeInfo = o.startTime.slice(0,10);
        if(o.recoverDate) timeInfo += ' ~ ' + o.recoverDate;
        return '<div style="margin-bottom:6px;line-height:1.4;">' +
          '<div style="display:flex;align-items:center;gap:4px;">' +
            '<span style="font-weight:600;font-size:11px;">'+((o.workOrderId||'待分配'))+'</span>' +
            operStatusTag(o.operStatus) +
          '</div>' +
          '<div style="color:#999;font-size:10px;margin-top:1px;">'+o.anomalyType+((o.subType?' · '+o.subType:''))+' &nbsp; '+timeInfo+'</div>' +
        '</div>';
      }).join('');
      html += '<tr onclick="openVehicleDrawer(\''+v.vehicleNo+'\')" style="cursor:pointer;">' +
        '<td>'+v.brand+'</td>' +
        '<td>'+v.station+'</td>' +
        '<td style="font-weight:600;">'+v.vehicleNo+'</td>' +
        '<td>'+vehicleStatusTag(vs)+'</td>' +
        '<td style="font-weight:600;padding:10px 6px;">'+v.orders.length+'</td>' +
        '<td style="'+impactDaysStyle(v.totalDays)+'padding:10px 6px;">'+v.totalDays+'天</td>' +
        '<td style="white-space:normal;max-width:280px;padding:10px 8px;">'+orderOverview+'</td>' +
        '<td class="col-action"><button class="btn btn-text" onclick="event.stopPropagation();openVehicleDrawer(\''+v.vehicleNo+'\')">详情</button></td>' +
        '</tr>';
    });
    tbody.innerHTML = html;
  }
}

  html += '<div class="info-item"><span class="info-label">关联工单</span><span class="info-value">'+(d.workOrderId?'<a href="javascript:void(0)" onclick="toast(\'工单详情：'+d.workOrderId+'\',\'warning\')" style="color:#1890ff;">'+d.workOrderId+'</a>':'-')+'</span></div>';

  var recText = d.recovered ? '已恢复' : '未恢复';
  var dayClass = d.impactDays >= 5 ? 'red' : d.impactDays >= 3 ? 'orange' : 'green';
  html += '<div class="impact-grid">';
  html += '<div class="impact-item"><div class="impact-label">异常开始时间</div><div class="impact-value blue">'+d.startTime+'</div></div>';
  html += '<div class="impact-item"><div class="impact-label">是否恢复运营</div><div class="impact-value '+recClass+'">'+recText+'</div></div>';
  html += '<div class="impact-item"><div class="impact-label">恢复日期</div><div class="impact-value">'+(d.recoverDate||'-')+'</div></div>';
  html += '<div class="impact-item"><div class="impact-label">影响运营天数</div><div class="impact-value '+dayClass+'">'+d.impactDays+'天</div></div>';
  html += '</div></div>';

  // 审批流程卡片
  html += '<div class="detail-card"><div class="section-title">审批流程</div>';
  html += '<div class="approval-flow">';
  d.approvalFlow.forEach(function(n, i) {
    var iconClass = '', titleClass = '';
    if(n.status==='已完成') { iconClass='done'; }
    else if(n.status==='待处理') { iconClass='current'; }
    else if(n.status==='已驳回') { iconClass='rejected'; }
    else if(n.status==='已取消') { iconClass='cancelled'; titleClass='cancelled'; }
    var nodeClass = iconClass;
    html += '<div class="approval-node '+nodeClass+'">';
    html += '<div class="node-icon '+iconClass+'"></div>';
    html += '<div class="node-content">';
    html += '<div class="node-title '+titleClass+'">'+n.node+'</div>';
    if(n.person) html += '<div class="node-info"><span class="name">'+n.person+'</span>'+(n.time?' · '+n.time:'')+'</div>';
    if(n.opinion) {
      var opinionClass = n.status==='已完成'?'approved':n.status==='已驳回'?'rejected-op':'';
      html += '<div class="node-opinion '+opinionClass+'">'+n.opinion+'</div>';
    }
    html += '</div></div>';
  });
  html += '</div></div>';

  // 工单进度卡片
  if(d.workOrderFlow) {
    html += '<div class="detail-card"><div class="section-title">工单进度</div>';
    html += '<div class="status-flow">';
    d.workOrderFlow.steps.forEach(function(step, i) {
      var circleClass = '', labelClass = '', lineClass = '';
      if(i < d.workOrderFlow.current) { circleClass='done'; labelClass=''; lineClass='done'; }
      else if(i === d.workOrderFlow.current) { circleClass='current'; labelClass='current-label'; }
      if(i > 0) html += '<div class="step-line '+lineClass+'"></div>';
      html += '<div class="status-step"><div class="step-circle '+circleClass+'"></div><div class="step-label '+labelClass+'">'+step+'</div></div>';
    });
    html += '</div>';
    if(d.workOrderFlow.timeline) {
      html += '<div class="timeline">';
      d.workOrderFlow.timeline.forEach(function(t) {
        var dotClass = t.dot || '';
        html += '<div class="timeline-item"><div class="timeline-dot '+dotClass+'"></div><div class="timeline-text">';
        if(t.time) html += '<span style="color:#bbb;font-size:11px;margin-right:8px;">'+t.time+'</span>';
        html += t.text+'</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  }

  document.getElementById('drawerTitle').innerHTML = d.vehicleNo + ' - ' + d.brand + ' ' + approvalTag(d.approvalStatus);
  document.getElementById('drawerBody').innerHTML = html;
  document.getElementById('drawerMask').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}

var approvalTargetId = null;
var approvalAction = null;
function openApprovalModal(id, action) {
  var d = mockData.find(function(x){return x.id===id;});
  if(!d) return;
  approvalTargetId = id;
  approvalAction = action;
  document.getElementById('approvalAnomalyId').textContent = d.vehicleNo;
  document.getElementById('approvalVehicleInfo').textContent = d.brand;
  document.getElementById('approvalAnomalyType').textContent = d.anomalyType;
  document.getElementById('approvalOpinion').value = '';
  document.getElementById('approvalModal').classList.add('show');
}
function closeApprovalModal() {
  document.getElementById('approvalModal').classList.remove('show');
  approvalTargetId = null;
  approvalAction = null;
}
function doApprove() {
  if(!approvalTargetId) return;
  var opinion = document.getElementById('approvalOpinion').value.trim();
  if(!opinion) { toast('请输入审批意见','warning'); return; }
  var d = mockData.find(function(x){return x.id===approvalTargetId;});
  if(!d) return;
  // 更新审批流：站长通过、区域运管自动通过、创建工单
  d.approvalStatus = '已通过';
  d.approvalFlow[1].status = '已完成';
  d.approvalFlow[1].opinion = opinion;
  d.approvalFlow[1].time = new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-');
  d.approvalFlow[2].status = '已完成';
  d.approvalFlow[2].opinion = '站长已审批通过，自动审批';
  d.approvalFlow[2].time = d.approvalFlow[1].time;
  d.approvalFlow[3].status = '已完成';
  d.workOrderId = 'WO' + Date.now().toString().slice(-10);
  d.approvalFlow[3].opinion = '已自动创建工单 ' + d.workOrderId;
  d.approvalFlow[3].time = d.approvalFlow[1].time;
  // 创建简单工单流
  d.workOrderFlow = { steps:['待服务站接单','服务站诊断中','待配件','维修中','维修完成'], current:0, timeline:[
    {status:'待接单',text:'等待服务站接单',time:'',dot:'current'}
  ]};
  closeApprovalModal();
  updateStats();
  applyFilters();
  toast('审批通过，已自动创建工单 ' + d.workOrderId, 'success');
}
function doReject() {
  if(!approvalTargetId) return;
  var opinion = document.getElementById('approvalOpinion').value.trim();
  if(!opinion) { toast('请输入驳回原因','warning'); return; }
  var d = mockData.find(function(x){return x.id===approvalTargetId;});
  if(!d) return;
  d.approvalStatus = '已驳回';
  d.operStatus = '已关闭';
  d.approvalFlow[1].status = '已驳回';
  d.approvalFlow[1].opinion = opinion;
  d.approvalFlow[1].time = new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-');
  d.approvalFlow[2].status = '已取消';
  d.approvalFlow[3].status = '已取消';
  closeApprovalModal();
  updateStats();
  applyFilters();
  toast('已驳回异常提报', 'error');
}

  var search = document.getElementById('filterSearch').value.trim().toLowerCase();
  var brand = document.getElementById('filterBrand').value;
  var anomalyType = document.getElementById('filterAnomalyType').value;
  var vehicleStatus = document.getElementById('filterVehicleStatus').value;
  var approval = document.getElementById('filterApproval').value;
  var dateStart = document.getElementById('filterDateStart').value;
  var dateEnd = document.getElementById('filterDateEnd').value;
  var filtered = mockData.filter(function(d) {
    if(search && d.vehicleNo.toLowerCase().indexOf(search)===-1) return false;
    if(brand && d.brand !== brand) return false;
    if(anomalyType && d.anomalyType !== anomalyType) return false;
    if(vehicleStatus && d.vehicleStatus !== vehicleStatus) return false;
    if(approval && d.approvalStatus !== approval) return false;
    if(dateStart && d.startTime < dateStart) return false;
    if(dateEnd && d.startTime > dateEnd + ' 23:59') return false;
    if(activeStatFilter && activeStatFilter.key) {
      if(activeStatFilter.key === 'approvalStatus' && d.approvalStatus !== activeStatFilter.val) return false;
      if(activeStatFilter.key === 'operStatus' && d.operStatus !== activeStatFilter.val) return false;
      if(activeStatFilter.key === 'vehicleStatus' && d.vehicleStatus !== activeStatFilter.val) return false;
    }
    return true;
  });
  if(filtered.length === 0) { toast('当前筛选范围内无数据可导出','warning'); return; }
  var headers = ['车号','品牌','所属站点','异常类型','异常子类','车辆状态','审批状态','运营状态','异常开始时间','是否恢复运营','恢复日期','影响天数','提报人','关联工单','异常描述'];
  var rows = filtered.map(function(d) {
    return [d.vehicleNo, d.brand, d.station, d.anomalyType, d.subType||'', d.vehicleStatus||'正常运营', d.approvalStatus, d.operStatus, d.startTime, d.recovered?'已恢复':'未恢复', d.recoverDate||'', d.impactDays, d.reporter, d.workOrderId||'', d.description];
  });
  var csvContent = '\uFEFF' + headers.join(',') + '\n' + rows.map(function(r) { return r.map(function(c) { return '"'+String(c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = '车辆异常追踪_' + new Date().toISOString().slice(0,10) + '.csv';
  link.click();
  URL.revokeObjectURL(url);
  toast('已导出 ' + filtered.length + ' 条数据','success');
}

// ===== 初始化 =====
updateStats();
applyFilters();
</script>
</body>
</html>
